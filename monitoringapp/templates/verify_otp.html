{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cybexel - Verify OTP</title>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;

            color: #ffffff;

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(92, 47, 145, .16),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 15%,
                    rgba(40, 88, 160, .12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(92, 47, 145, .10),
                    transparent 32%
                ),
                #08080d;
        }


        /* =========================================
           PAGE
        ========================================= */

        .otp-page {
            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            overflow: hidden;
        }


        /* =========================================
           AMBIENT GLOW
        ========================================= */

        .ambient-glow {
            position: absolute;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            background: rgba(111, 76, 190, .12);

            filter: blur(100px);

            pointer-events: none;
        }


        .ambient-glow.one {
            top: -180px;
            left: -150px;
        }


        .ambient-glow.two {
            right: -170px;
            bottom: -180px;

            background: rgba(63, 79, 153, .12);
        }


        /* =========================================
           OTP CARD
        ========================================= */

        .otp-card {
            position: relative;

            width: min(430px, 100%);

            padding: 34px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(38, 24, 49, .94),
                    rgba(14, 14, 21, .97)
                );

            border: 1px solid rgba(255, 255, 255, .12);

            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);

            box-shadow:
                0 30px 90px rgba(0, 0, 0, .48),
                inset 0 1px 0 rgba(255, 255, 255, .055);

            overflow: hidden;
        }


        .otp-card::before {
            content: "";

            position: absolute;

            width: 250px;
            height: 250px;

            top: -150px;
            right: -100px;

            background: rgba(139, 92, 246, .16);

            filter: blur(75px);

            pointer-events: none;
        }


        .otp-card::after {
            content: "";

            position: absolute;

            width: 220px;
            height: 160px;

            bottom: -130px;
            left: -100px;

            background: rgba(79, 70, 229, .10);

            filter: blur(70px);

            pointer-events: none;
        }


        .otp-content {
            position: relative;
            z-index: 2;
        }


        /* =========================================
           BRAND
        ========================================= */

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;

            margin-bottom: 28px;
        }


        .brand-icon {
            width: 76px;
            height: 76px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 14px;

            border-radius: 21px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.09),
                    rgba(255,255,255,.025)
                );

            border: 1px solid rgba(255,255,255,.10);

            box-shadow:
                0 14px 35px rgba(0,0,0,.28),
                inset 0 1px 0 rgba(255,255,255,.06);
        }


        .brand-icon img {
            width: 58px;
            height: 58px;

            object-fit: contain;
        }


        .eyebrow {
            margin-bottom: 8px;

            color: #a78bfa;

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 3px;

            text-transform: uppercase;

            text-align: center;
        }


        .brand h1 {
            margin: 0;

            color: #ffffff;

            font-size: 27px;
            line-height: 1.1;

            font-weight: 900;

            letter-spacing: -.6px;

            text-align: center;
        }


        .brand p {
            margin: 9px 0 0;

            max-width: 300px;

            color: #85818d;

            font-size: 11px;

            line-height: 1.6;

            text-align: center;
        }


        /* =========================================
           FORM
        ========================================= */

        .otp-form {
            display: flex;
            flex-direction: column;

            gap: 17px;
        }


        .field {
            display: flex;
            flex-direction: column;

            gap: 7px;
        }


        .field label {
            color: #aaa6b2;

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 1.4px;

            text-transform: uppercase;
        }


        .input-wrap {
            position: relative;
        }


        .input-icon {
            position: absolute;

            left: 14px;
            top: 50%;

            width: 17px;
            height: 17px;

            transform: translateY(-50%);

            display: flex;
            align-items: center;
            justify-content: center;

            color: #817b8c;

            pointer-events: none;

            transition: color .2s ease;
        }


        .input-icon svg {
            width: 17px;
            height: 17px;

            stroke-width: 1.7;
        }


        .field input {
            width: 100%;
            height: 52px;

            padding: 0 42px 0 42px;

            outline: none;

            color: #ffffff;

            font-family: inherit;

            font-size: 15px;

            font-weight: 700;

            letter-spacing: 4px;

            text-align: center;

            background: rgba(255,255,255,.035);

            border: 1px solid rgba(255,255,255,.08);

            border-radius: 13px;

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.025);

            transition:
                border-color .22s ease,
                background .22s ease,
                box-shadow .22s ease;
        }


        .field input::placeholder {
            color: #67636e;

            font-size: 11px;

            font-weight: 500;

            letter-spacing: 1px;
        }


        .field input:focus {
            background: rgba(255,255,255,.05);

            border-color: rgba(139,92,246,.48);

            box-shadow:
                0 0 0 3px rgba(139,92,246,.08),
                inset 0 1px 0 rgba(255,255,255,.035);
        }


        .input-wrap:focus-within .input-icon {
            color: #a78bfa;
        }


        /* =========================================
           VERIFY BUTTON
        ========================================= */

        .verify-button {
            position: relative;

            width: 100%;
            height: 48px;

            margin-top: 4px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 9px;

            border: 1px solid rgba(154,122,255,.35);

            border-radius: 13px;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #7048c6,
                    #5554c8
                );

            box-shadow:
                0 12px 28px rgba(99,102,241,.20),
                inset 0 1px 0 rgba(255,255,255,.13);

            font-family: inherit;

            font-size: 11px;
            font-weight: 800;

            cursor: pointer;

            transition:
                transform .22s ease,
                box-shadow .22s ease,
                filter .22s ease;
        }


        .verify-button::before {
            content: "";

            position: absolute;

            top: 1px;
            left: 14%;
            right: 14%;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.35),
                    transparent
                );
        }


        .verify-button svg {
            width: 16px;
            height: 16px;

            stroke-width: 2;
        }


        .verify-button:hover {
            transform: translateY(-2px);

            filter: brightness(1.07);

            box-shadow:
                0 16px 34px rgba(99,102,241,.28),
                0 0 20px rgba(139,92,246,.10),
                inset 0 1px 0 rgba(255,255,255,.16);
        }


        .verify-button:active {
            transform: translateY(0);
        }


        /* =========================================
           BACK TO LOGIN
        ========================================= */

        .back-login {
            margin-top: 4px;

            text-align: center;
        }


        .back-login a {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 6px;

            color: #9584c7;

            font-size: 10px;
            font-weight: 700;

            text-decoration: none;

            transition:
                color .2s ease,
                text-shadow .2s ease;
        }


        .back-login a:hover {
            color: #b79cff;

            text-decoration: underline;

            text-shadow:
                0 0 12px rgba(139,92,246,.25);
        }


        .back-login svg {
            width: 13px;
            height: 13px;
        }


        /* =========================================
           FOOTER
        ========================================= */

        .otp-footer {
            margin-top: 22px;

            padding-top: 17px;

            border-top:
                1px solid rgba(255,255,255,.06);

            color: #625e69;

            font-size: 8px;
            font-weight: 700;

            letter-spacing: 1.6px;

            text-align: center;

            text-transform: uppercase;
        }


        .otp-footer span {
            color: #8170ad;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 480px) {

            .otp-page {
                padding: 16px;
            }

            .otp-card {
                padding: 27px 22px;

                border-radius: 23px;
            }

            .brand {
                margin-bottom: 24px;
            }

            .brand-icon {
                width: 68px;
                height: 68px;

                border-radius: 19px;
            }

            .brand-icon img {
                width: 53px;
                height: 53px;
            }

            .brand h1 {
                font-size: 24px;
            }

            .field input {
                height: 50px;

                font-size: 14px;
            }

            .verify-button {
                height: 46px;
            }
        }


        @media (max-height: 600px) {

            .otp-page {
                align-items: flex-start;

                padding-top: 18px;
                padding-bottom: 18px;

                overflow-y: auto;
            }

            .otp-card {
                margin: auto 0;
            }

            .brand {
                margin-bottom: 20px;
            }

            .brand-icon {
                width: 62px;
                height: 62px;

                margin-bottom: 10px;
            }

            .brand h1 {
                font-size: 23px;
            }
        }
    </style>
</head>


<body>

<div class="otp-page">

    <!-- Background glow -->
    <div class="ambient-glow one"></div>
    <div class="ambient-glow two"></div>


    <!-- OTP Card -->
    <div class="otp-card">

        <div class="otp-content">


            <!-- Brand -->
            <div class="brand">

                <div class="brand-icon">

                    <img
                        src="{% static 'images/logo.png' %}"
                        alt="Cybexel Logo"
                    >

                </div>


                <div class="eyebrow">
                    CYBEXEL
                </div>


                <h1>
                    Verify OTP
                </h1>


                <p>
                    Enter the 6-digit verification code sent to your registered email
                </p>

            </div>


            <!-- OTP Form -->
            <form
                method="POST"
                class="otp-form"
            >

                {% csrf_token %}


                <div class="field">

                    <label for="otp">
                        Verification Code
                    </label>


                    <div class="input-wrap">

                        <input
                            type="text"
                            name="otp"
                            id="otp"
                            placeholder="Enter 6-digit code"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            maxlength="6"
                            pattern="[0-9]{6}"
                            required
                        >


                        <span class="input-icon">

                            <i data-lucide="shield-check"></i>

                        </span>

                    </div>

                </div>


                <!-- Verify Button -->
                <button
                    type="submit"
                    class="verify-button"
                >

                    <i data-lucide="badge-check"></i>

                    <span>
                        Verify OTP
                    </span>

                </button>


                <!-- Back to Login -->
                <div class="back-login">

                    <a href="{% url 'login_view' %}">

                        <i data-lucide="arrow-left"></i>

                        <span>
                            Back to Login
                        </span>

                    </a>

                </div>

            </form>


            <!-- Footer -->
            <div class="otp-footer">

                Secure access powered by
                <span>Cybexel</span>

            </div>


        </div>

    </div>

</div>


<script>
    document.addEventListener(
        "DOMContentLoaded",
        function () {

            if (typeof lucide !== "undefined") {
                lucide.createIcons();
            }

        }
    );
</script>

</body>
</html>
