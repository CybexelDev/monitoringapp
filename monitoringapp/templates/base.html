{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Monitoring System{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-white">

  <!-- Page Content -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Toast Container (global alerts) -->
  <div id="toast-container" class="fixed bottom-4 right-4 space-y-2 z-50"></div>

  <script>
    // Reusable toast function
    function showToast(message, type="warning") {
      const colors = {
        success: "bg-green-500",
        warning: "bg-yellow-500",
        error: "bg-red-500"
      };

      const toast = document.createElement("div");
      toast.className = colors[type] + " text-black px-4 py-2 rounded shadow";
      toast.innerText = message;

      document.getElementById("toast-container").appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 4000); // disappear after 4s
    }
  </script>
  <script>
  let lastActivitySent = 0;

  function updateActivity() {
    const now = Date.now();

    // Send activity update at most once every 30 seconds
    if (now - lastActivitySent < 30000) {
      return;
    }

    lastActivitySent = now;

    fetch("{% url 'update_activity' %}", {
      method: "POST",
      headers: {
        "X-CSRFToken": getCookie("csrftoken"),
        "Content-Type": "application/json"
      }
    })
    .catch(error => {
      console.error("Activity update failed:", error);
    });
  }

  function getCookie(name) {
    let cookieValue = null;

    if (document.cookie && document.cookie !== "") {
      const cookies = document.cookie.split(";");

      for (let cookie of cookies) {
        cookie = cookie.trim();

        if (cookie.startsWith(name + "=")) {
          cookieValue = decodeURIComponent(
            cookie.substring(name.length + 1)
          );
          break;
        }
      }
    }

    return cookieValue;
  }

  // User activity detection
  document.addEventListener("mousemove", updateActivity);
  document.addEventListener("mousedown", updateActivity);
  document.addEventListener("keydown", updateActivity);
  document.addEventListener("click", updateActivity);
  document.addEventListener("scroll", updateActivity);
</script>

{% block extra_js %}{% endblock %}
  
  {% block extra_js %}{% endblock %}

  <script src="{% static 'js/activity.js' %}"></script>
</body>
</html>
