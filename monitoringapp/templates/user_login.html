{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cybexel Login</title>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            color: #ffffff;

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(92, 47, 145, .16),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 15%,
                    rgba(40, 88, 160, .12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(92, 47, 145, .10),
                    transparent 32%
                ),
                #08080d;
        }


        /* =========================================================
           LOGIN PAGE
        ========================================================= */

        .login-page {
            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            overflow: hidden;
        }


        /* =========================================================
           AMBIENT GLOW
        ========================================================= */

        .ambient-glow {
            position: absolute;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            background: rgba(111, 76, 190, .12);

            filter: blur(100px);

            pointer-events: none;
        }

        .ambient-glow.one {
            top: -180px;
            left: -150px;
        }

        .ambient-glow.two {
            right: -170px;
            bottom: -180px;

            background: rgba(63, 79, 153, .12);
        }


        /* =========================================================
           LOGIN CARD
        ========================================================= */

        .login-card {
            position: relative;

            width: min(430px, 100%);

            padding: 34px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(38, 24, 49, .94),
                    rgba(14, 14, 21, .97)
                );

            border: 1px solid rgba(255, 255, 255, .12);

            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);

            box-shadow:
                0 30px 90px rgba(0, 0, 0, .48),
                inset 0 1px 0 rgba(255, 255, 255, .055);

            overflow: hidden;
        }


        /* Top purple glow */

        .login-card::before {
            content: "";

            position: absolute;

            width: 250px;
            height: 250px;

            top: -150px;
            right: -100px;

            background: rgba(139, 92, 246, .16);

            filter: blur(75px);

            pointer-events: none;
        }


        /* Bottom glow */

        .login-card::after {
            content: "";

            position: absolute;

            width: 220px;
            height: 160px;

            bottom: -130px;
            left: -100px;

            background: rgba(79, 70, 229, .10);

            filter: blur(70px);

            pointer-events: none;
        }


        .login-content {
            position: relative;
            z-index: 2;
        }


        /* =========================================================
           BRAND
        ========================================================= */

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;

            margin-bottom: 28px;
        }


        .brand-icon {
            width: 76px;
            height: 76px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 14px;

            border-radius: 21px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.09),
                    rgba(255,255,255,.025)
                );

            border: 1px solid rgba(255,255,255,.10);

            box-shadow:
                0 14px 35px rgba(0,0,0,.28),
                inset 0 1px 0 rgba(255,255,255,.06);
        }


        .brand-icon img {
            width: 58px;
            height: 58px;

            object-fit: contain;
        }


        .brand-icon svg {
            width: 30px;
            height: 30px;

            color: #b79cff;

            stroke-width: 1.7;

            filter:
                drop-shadow(
                    0 0 10px
                    rgba(139,92,246,.35)
                );
        }


        .eyebrow {
            margin-bottom: 8px;

            color: #a78bfa;

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 3px;

            text-transform: uppercase;

            text-align: center;
        }


        .brand h1 {
            margin: 0;

            color: #ffffff;

            font-size: 27px;

            line-height: 1.1;

            font-weight: 900;

            letter-spacing: -.6px;

            text-align: center;
        }


        .brand p {
            margin: 9px 0 0;

            color: #85818d;

            font-size: 11px;

            text-align: center;
        }


        /* =========================================================
           DJANGO MESSAGES
        ========================================================= */

        .messages {
            margin-bottom: 17px;

            padding: 11px 13px;

            border-radius: 12px;

            background: rgba(255, 70, 100, .055);

            border: 1px solid rgba(255, 80, 110, .16);

            color: #ff9aaa;

            font-size: 10px;

            line-height: 1.5;
        }


        .messages ul {
            margin: 0;

            padding-left: 16px;
        }


        .messages p {
            margin: 0 0 4px;
        }

        .messages p:last-child {
            margin-bottom: 0;
        }


        /* =========================================================
           FORM
        ========================================================= */

        .login-form {
            display: flex;

            flex-direction: column;

            gap: 17px;
        }


        .field {
            display: flex;

            flex-direction: column;

            gap: 7px;
        }


        .field label {
            color: #aaa6b2;

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 1.4px;

            text-transform: uppercase;
        }


        /* =========================================================
           INPUT WRAPPER
        ========================================================= */

        .input-wrap {
            position: relative;
        }


        .input-icon {
            position: absolute;

            left: 14px;
            top: 50%;

            width: 17px;
            height: 17px;

            transform: translateY(-50%);

            display: flex;
            align-items: center;
            justify-content: center;

            color: #817b8c;

            pointer-events: none;

            transition: color .2s ease;
        }


        .input-icon svg {
            width: 17px;
            height: 17px;

            stroke-width: 1.7;
        }


        /* =========================================================
           SELECT + INPUT
        ========================================================= */

        .field input,
        .field select {
            width: 100%;

            height: 48px;

            padding: 0 14px 0 42px;

            outline: none;

            color: #ffffff;

            font-family: inherit;

            font-size: 11px;

            background: rgba(255,255,255,.035);

            border: 1px solid rgba(255,255,255,.08);

            border-radius: 13px;

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.025);

            transition:
                border-color .22s ease,
                background .22s ease,
                box-shadow .22s ease;
        }


        .field input::placeholder {
            color: #67636e;
        }


        .field select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;

            cursor: pointer;

            padding-right: 40px;

            background-image:
                linear-gradient(45deg, transparent 50%, #817b8c 50%),
                linear-gradient(135deg, #817b8c 50%, transparent 50%);

            background-position:
                calc(100% - 17px) 20px,
                calc(100% - 12px) 20px;

            background-size:
                5px 5px,
                5px 5px;

            background-repeat: no-repeat;
        }


        .field select option {
            background: #17131c;

            color: #ffffff;
        }


        .field input:focus,
        .field select:focus {
            background: rgba(255,255,255,.05);

            border-color: rgba(139,92,246,.48);

            box-shadow:
                0 0 0 3px rgba(139,92,246,.08),
                inset 0 1px 0 rgba(255,255,255,.035);
        }


        .field input:focus ~ .input-icon,
        .input-wrap:focus-within .input-icon {
            color: #a78bfa;
        }


        /* =========================================================
           LOGIN BUTTON
        ========================================================= */

        .login-button {
            position: relative;

            width: 100%;

            height: 48px;

            margin-top: 4px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 9px;

            border: 1px solid rgba(154,122,255,.35);

            border-radius: 13px;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #7048c6,
                    #5554c8
                );

            box-shadow:
                0 12px 28px rgba(99,102,241,.20),
                inset 0 1px 0 rgba(255,255,255,.13);

            font-family: inherit;

            font-size: 11px;

            font-weight: 800;

            cursor: pointer;

            transition:
                transform .22s ease,
                box-shadow .22s ease,
                filter .22s ease;
        }


        .login-button::before {
            content: "";

            position: absolute;

            top: 1px;

            left: 14%;
            right: 14%;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.35),
                    transparent
                );
        }


        .login-button svg {
            width: 16px;
            height: 16px;

            stroke-width: 2;
        }


        .login-button:hover {
            transform: translateY(-2px);

            filter: brightness(1.07);

            box-shadow:
                0 16px 34px rgba(99,102,241,.28),
                0 0 20px rgba(139,92,246,.10),
                inset 0 1px 0 rgba(255,255,255,.16);
        }


        .login-button:active {
            transform: translateY(0);
        }


        /* =========================================================
           FORGOT PASSWORD
        ========================================================= */

        .forgot-password {
            margin-top: -3px;

            text-align: center;
        }


        .forgot-password a {
            color: #9584c7;

            font-size: 10px;

            font-weight: 700;

            text-decoration: none;

            transition:
                color .2s ease,
                text-shadow .2s ease;
        }


        .forgot-password a:hover {
            color: #b79cff;

            text-decoration: underline;

            text-shadow:
                0 0 12px rgba(139,92,246,.25);
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        .login-footer {
            margin-top: 22px;

            padding-top: 17px;

            border-top:
                1px solid rgba(255,255,255,.06);

            color: #625e69;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 1.6px;

            text-align: center;

            text-transform: uppercase;
        }


        .login-footer span {
            color: #8170ad;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 480px) {

            .login-page {
                padding: 16px;
            }


            .login-card {
                padding: 27px 22px;

                border-radius: 23px;
            }


            .brand {
                margin-bottom: 24px;
            }


            .brand-icon {
                width: 68px;
                height: 68px;

                border-radius: 19px;
            }


            .brand-icon img {
                width: 53px;
                height: 53px;
            }


            .brand h1 {
                font-size: 24px;
            }


            .field input,
            .field select,
            .login-button {
                height: 46px;
            }

        }


        @media (max-height: 650px) {

            .login-page {
                align-items: flex-start;

                padding-top: 18px;
                padding-bottom: 18px;

                overflow-y: auto;
            }


            .login-card {
                margin: auto 0;
            }


            .brand {
                margin-bottom: 20px;
            }


            .brand-icon {
                width: 62px;
                height: 62px;

                margin-bottom: 10px;
            }


            .brand h1 {
                font-size: 23px;
            }

        }

        /* Position dropdown — matched to the Team Lead dashboard */
        .position-themed { position:relative; width:100%; }
        .position-themed select { position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:0!important; opacity:0!important; clip-path:inset(50%); pointer-events:none; }
        .position-select-button { display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; height:48px; padding:0 15px 0 42px; border:1px solid #ab8af4; border-radius:16px; background:#100d17; color:#f1eaff; font:inherit; font-size:11px; text-align:left; cursor:pointer; transition:border-color .2s,box-shadow .2s,background .2s; }
        .position-select-button:hover { border-color:#bda5ff; background:#151020; }
        .position-select-button:focus-visible,.position-select-button[aria-expanded="true"] { outline:none; border-color:#a78bfa; box-shadow:0 0 0 3px rgba(139,92,246,.16); }
        .position-select-button[aria-invalid="true"] { border-color:#fb7185; }
        .position-select-button .position-arrow { display:block; flex:0 0 8px; width:8px; height:8px; margin:-4px 3px 0 0; border-right:1.8px solid #c4b5fd; border-bottom:1.8px solid #c4b5fd; transform:rotate(45deg); transition:transform .18s; }
        .position-select-button[aria-expanded="true"] .position-arrow { transform:rotate(225deg); margin-top:4px; }
        .position-dropdown-list { position:fixed; z-index:99999; overflow-y:auto; padding:9px; border:1px solid #383046; border-radius:17px; background:linear-gradient(160deg,#181222,#0e0c15); box-shadow:0 20px 45px rgba(0,0,0,.5); scrollbar-width:thin; scrollbar-color:#8b5cf6 #21192f; }
        .position-dropdown-list[hidden] { display:none!important; }
        .position-dropdown-option { display:flex; justify-content:space-between; align-items:center; min-height:45px; padding:12px 15px; border-radius:12px; color:#f0eaf8; font:inherit; font-size:13px; cursor:pointer; }
        .position-dropdown-option:hover,.position-dropdown-option.is-focused { background:rgba(105,76,179,.30); color:white; }
        .position-dropdown-option[aria-selected="true"] { background:linear-gradient(100deg,rgba(88,57,154,.36),rgba(47,40,95,.30)); color:#ffffff; font-weight:600; }
        .position-themed .input-icon { z-index:2; }
        @media(max-width:480px) { .position-select-button { height:46px; font-size:14px; } .position-dropdown-option { min-height:44px; font-size:14px; } }
    </style>
</head>


<body>

<div class="login-page">

    <!-- Ambient background glows -->
    <div class="ambient-glow one"></div>
    <div class="ambient-glow two"></div>


    <!-- =========================================================
         LOGIN CARD
    ========================================================== -->

    <div class="login-card">

        <div class="login-content">


            <!-- =================================================
                 BRAND
            ================================================== -->

            <div class="brand">

                <div class="brand-icon">

                    <img
                        src="{% static 'images/logo.png' %}"
                        alt="Cybexel Logo"
                    >

                </div>


                <div class="eyebrow">
                    CYBEXEL
                </div>


                <h1>
                    Welcome Back
                </h1>


                <p>
                    Sign in to access your workspace
                </p>

            </div>


            <!-- =================================================
                 DJANGO MESSAGES
            ================================================== -->

            {% if messages %}

                <div class="messages">

                    <ul>

                        {% for message in messages %}

                            <li>
                                {{ message }}
                            </li>

                        {% endfor %}

                    </ul>

                </div>

            {% endif %}


            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                method="POST"
                action="{% url 'login_view' %}"
                class="login-form"
            >

                {% csrf_token %}


                <!-- =============================================
                     POSITION
                ============================================== -->

                <div class="field">

                    <label for="position">
                        Position
                    </label>

                    <div class="input-wrap position-themed">

                        <select
                            name="position"
                            id="position"
                            required
                        >

                            <option value="">
                                Select Position
                            </option>

                            <option value="team_lead">
                                Team Lead
                            </option>

                            <option value="team_member">
                                Team Member
                            </option>

                            <option value="management">
                                Admin
                            </option>
                            <option value="accounts">
                                Accounts
                            </option>

                        </select>


                        <span class="input-icon">
                            <i data-lucide="briefcase-business"></i>
                        </span>

                    </div>

                </div>


                <!-- =============================================
                     USERNAME
                ============================================== -->

                <div class="field">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-wrap">

                        <input
                            type="text"
                            name="username"
                            id="username"
                            placeholder="Enter username"
                            autocomplete="username"
                            required
                        >


                        <span class="input-icon">
                            <i data-lucide="user-round"></i>
                        </span>

                    </div>

                </div>


                <!-- =============================================
                     PASSWORD
                ============================================== -->

                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrap">

                        <input
                            type="password"
                            name="password"
                            id="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >


                        <span class="input-icon">
                            <i data-lucide="lock-keyhole"></i>
                        </span>

                    </div>

                </div>


                <!-- =============================================
                     LOGIN BUTTON
                ============================================== -->

                <button
                    type="submit"
                    class="login-button"
                >

                    <i data-lucide="log-in"></i>

                    <span>
                        Login
                    </span>

                </button>


         

            </form>


            <!-- =================================================
                 FOOTER
            ================================================== -->

            <div class="login-footer">

                Secure access powered by
                <span>Cybexel</span>

            </div>

        </div>

    </div>

</div>


<script>
    document.addEventListener("DOMContentLoaded", function () {

        if (typeof lucide !== "undefined") {
            lucide.createIcons();
        }

    });
</script>


<script>
/* Dashboard-style Position selector; original Django select remains the submitted field. */
(() => {
  const select = document.getElementById('position');
  if (!select) return;
  const wrap = select.closest('.position-themed');
  const button = document.createElement('button');
  button.type = 'button'; button.className = 'position-select-button';
  button.setAttribute('aria-haspopup','listbox'); button.setAttribute('aria-expanded','false');
  const label = document.createElement('span');
  const arrow = document.createElement('span'); arrow.className = 'position-arrow'; arrow.setAttribute('aria-hidden','true');
  button.append(label,arrow);
  select.after(button); select.tabIndex = -1;
  const list = document.createElement('div'); list.className = 'position-dropdown-list';
  list.id = 'loginPositionOptions'; list.setAttribute('role','listbox'); list.setAttribute('aria-label','Position'); list.hidden = true;
  button.setAttribute('aria-controls',list.id);
  document.body.append(list);
  let active = select.selectedIndex;
  let items = [];
  function sync() {
    label.textContent = select.options[select.selectedIndex]?.textContent.trim() || 'Select Position';
    button.setAttribute('aria-label','Position: '+label.textContent);
    if (select.validity.valid) button.removeAttribute('aria-invalid');
  }
  function close() { list.hidden = true; button.setAttribute('aria-expanded','false'); button.removeAttribute('aria-activedescendant'); }
  function place() {
    if (list.hidden) return;
    const r=button.getBoundingClientRect(), below=innerHeight-r.bottom-10, above=r.top-10;
    const up=below<180 && above>below;
    list.style.width=Math.min(r.width,innerWidth-24)+'px';
    list.style.left=Math.max(12,Math.min(r.left,innerWidth-Math.min(r.width,innerWidth-24)-12))+'px';
    list.style.maxHeight=Math.max(60,Math.min(310,up?above:below))+'px';
    list.style.top=up?'auto':r.bottom+6+'px';
    list.style.bottom=up?innerHeight-r.top+6+'px':'auto';
  }
  function highlight(index) {
    if(index<0 || index>=items.length) return;
    active=index;
    items.forEach((el,i)=>el.classList.toggle('is-focused',i===index));
    button.setAttribute('aria-activedescendant',items[index].id);
    items[index].scrollIntoView({block:'nearest'});
  }
  function choose(index) {
    if (!select.options[index] || select.options[index].disabled) return;
    select.selectedIndex=index;
    select.dispatchEvent(new Event('change',{bubbles:true}));
    sync(); close(); button.focus({preventScroll:true});
  }
  function open() {
    list.replaceChildren(); items=[];
    [...select.options].forEach((opt,index)=>{
      const item=document.createElement('div'); item.className='position-dropdown-option';
      item.id='loginPositionOption'+index; item.setAttribute('role','option');
      item.setAttribute('aria-selected',String(opt.selected));
      const txt=document.createElement('span'); txt.textContent=opt.textContent.trim(); item.append(txt);
      if(opt.selected){const tick=document.createElement('span');tick.textContent='✓';tick.style.cssText='font-size:18px;color:#a99bc2';tick.setAttribute('aria-hidden','true');item.append(tick);}
      item.addEventListener('pointerdown',e=>e.preventDefault());
      item.addEventListener('click',()=>choose(index));
      list.append(item);items.push(item);
    });
    list.hidden=false;button.setAttribute('aria-expanded','true');place();
    highlight(select.selectedIndex>=0?select.selectedIndex:0);
  }
  button.addEventListener('click',()=>list.hidden?open():close());
  button.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if(!list.hidden){e.preventDefault();close();}return;}
    if(e.key==='Tab'){close();return;}
    if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){
      e.preventDefault();if(list.hidden){open();return;}
      const n=select.options.length;
      highlight(e.key==='Home'?0:e.key==='End'?n-1:Math.max(0,Math.min(n-1,active+(e.key==='ArrowDown'?1:-1))));
    } else if(e.key==='Enter'||e.key===' '){e.preventDefault();if(list.hidden)open();else choose(active);}
  });
  document.addEventListener('pointerdown',e=>{if(!wrap.contains(e.target)&&!list.contains(e.target))close();});
  document.addEventListener('scroll',place,true);window.addEventListener('resize',place);
  select.addEventListener('change',sync);
  select.addEventListener('invalid',e=>{e.preventDefault();button.setAttribute('aria-invalid','true');button.focus();});
  document.querySelector('label[for="position"]')?.addEventListener('click',e=>{e.preventDefault();button.focus();});
  sync();
})();
</script>
</body>
</html>
