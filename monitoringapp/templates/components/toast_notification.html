<!-- Reusable Team Lead notification component: include once per page, near </body>. -->
<div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="false"></div>
{% if messages %}
<div id="toast-django-messages" hidden>
    {% for message in messages %}
    {# Chat pages also use messages for their history; only Django alerts have level. #}
    {% if message.level %}
    <span data-type="{{ message.tags|default:'info' }}">{{ message }}</span>
    {% endif %}
    {% endfor %}
</div>
{% endif %}
<style>

/* =========================================================
   TOAST CONTAINER
   ========================================================= */

.toast-container {

    position: fixed;

    bottom: 24px;
    right: 24px;

    z-index: 99999;

    width: 380px;
    max-width: calc(100vw - 32px);

    display: flex;
    flex-direction: column;

    gap: 12px;

    pointer-events: none;
}


/* =========================================================
   TOAST BASE
   ========================================================= */

.toast {

    position: relative;

    width: 100%;
    min-height: 76px;

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 13px 14px;

    box-sizing: border-box;

    overflow: hidden;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            rgba(29, 27, 43, 0.97),
            rgba(17, 18, 32, 0.98)
        );

    border: 1px solid rgba(255, 255, 255, 0.08);

    box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.38),
        0 4px 16px rgba(0, 0, 0, 0.18);

    backdrop-filter: blur(16px);

    pointer-events: auto;

    animation:
        toastSlideIn 0.35s ease forwards;
}


/* =========================================================
   TOAST ICON
   ========================================================= */

.toast-icon {

    width: 38px;
    height: 38px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 11px;
}

.toast-icon svg {

    width: 19px;
    height: 19px;

    stroke-width: 2.5;
}


/* =========================================================
   TOAST CONTENT
   ========================================================= */

.toast-content {

    flex: 1;

    min-width: 0;

    padding-right: 4px;
}

.toast-title {

    margin-bottom: 3px;

    font-size: 12px;

    font-weight: 800;

    line-height: 1.2;
}

.toast-message {

    font-size: 11px;

    font-weight: 500;

    line-height: 1.45;

    color: #aaa7b7;

    word-break: break-word;
}


/* =========================================================
   CLOSE BUTTON
   ========================================================= */

.toast-close {

    width: 28px;
    height: 28px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;

    border-radius: 8px;

    background: transparent;

    color: #777384;

    cursor: pointer;

    transition:
        background 0.2s ease,
        color 0.2s ease;
}

.toast-close:hover {

    background:
        rgba(255, 255, 255, 0.07);

    color: #f2f0f7;
}

.toast-close svg {

    width: 15px;
    height: 15px;
}


/* =========================================================
   SUCCESS
   ========================================================= */

.toast-success {

    border-color:
        rgba(34, 197, 94, 0.20);
}

.toast-success .toast-icon {

    background:
        rgba(34, 197, 94, 0.12);

    color: #4ade80;
}

.toast-success .toast-title {

    color: #86efac;
}

.toast-success .toast-progress {

    background: #22c55e;
}


/* =========================================================
   ERROR
   ========================================================= */

.toast-error {

    border-color:
        rgba(239, 68, 68, 0.20);
}

.toast-error .toast-icon {

    background:
        rgba(239, 68, 68, 0.12);

    color: #f87171;
}

.toast-error .toast-title {

    color: #fca5a5;
}

.toast-error .toast-progress {

    background: #ef4444;
}


/* =========================================================
   WARNING
   ========================================================= */

.toast-warning {

    border-color:
        rgba(245, 158, 11, 0.20);
}

.toast-warning .toast-icon {

    background:
        rgba(245, 158, 11, 0.12);

    color: #fbbf24;
}

.toast-warning .toast-title {

    color: #fde68a;
}

.toast-warning .toast-progress {

    background: #f59e0b;
}


/* =========================================================
   INFO
   ========================================================= */

.toast-info {

    border-color:
        rgba(59, 130, 246, 0.20);
}

.toast-info .toast-icon {

    background:
        rgba(59, 130, 246, 0.12);

    color: #60a5fa;
}

.toast-info .toast-title {

    color: #93c5fd;
}

.toast-info .toast-progress {

    background: #3b82f6;
}


/* =========================================================
   PROGRESS BAR
   ========================================================= */

.toast-progress {

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 2px;

    opacity: 0.75;

    transform-origin: left;

    animation:
        toastProgress 5s linear forwards;
}


/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes toastSlideIn {

    from {

        opacity: 0;

        transform:
            translateX(35px)
            scale(0.97);
    }

    to {

        opacity: 1;

        transform:
            translateX(0)
            scale(1);
    }
}


@keyframes toastProgress {

    from {
        transform: scaleX(1);
    }

    to {
        transform: scaleX(0);
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .toast-container {

        top: 14px;
        right: 14px;
        left: 14px;

        width: auto;
        max-width: none;
    }

    .toast {

        min-height: 72px;

        padding: 12px;
    }

    .toast-icon {

        width: 36px;
        height: 36px;
    }

    .toast-title {

        font-size: 11px;
    }

    .toast-message {

        font-size: 10px;
    }
}

</style>
<script>
(function () {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const icons = {success: 'check', error: 'x', warning: 'triangle-alert', info: 'info'};
    const titles = {success: 'Success', error: 'Error', warning: 'Warning', info: 'Information'};
    function notify(message, type) {
        const kind = String(type || 'info').split(/\s+/).find(tag => icons[tag]) || 'info';
        const toast = document.createElement('div');
        toast.className = 'toast toast-' + kind;
        toast.setAttribute('role', kind === 'error' ? 'alert' : 'status');
        const icon = document.createElement('div');
        icon.className = 'toast-icon';
        const glyph = document.createElement('i');
        glyph.setAttribute('data-lucide', icons[kind]);
        icon.appendChild(glyph);
        const content = document.createElement('div');
        content.className = 'toast-content';
        const title = document.createElement('div');
        title.className = 'toast-title';
        title.textContent = titles[kind];
        const body = document.createElement('div');
        body.className = 'toast-message';
        body.textContent = String(message);
        content.append(title, body);
        const close = document.createElement('button');
        close.type = 'button';
        close.className = 'toast-close';
        close.setAttribute('aria-label', 'Close notification');
        const x = document.createElement('i');
        x.setAttribute('data-lucide', 'x');
        close.appendChild(x);
        const progress = document.createElement('div');
        progress.className = 'toast-progress';
        toast.append(icon, content, close, progress);
        container.appendChild(toast);
        if (window.lucide) window.lucide.createIcons();
        let timer;
        const dismiss = () => {
            clearTimeout(timer);
            toast.style.animation = 'toastSlideOut .25s ease forwards';
            setTimeout(() => toast.remove(), 250);
        };
        close.addEventListener('click', dismiss);
        timer = setTimeout(dismiss, 5000);
        return toast;
    }
    window.showToast = notify;
    const pending = document.getElementById('toast-django-messages');
    if (pending) {
        pending.querySelectorAll('[data-type]').forEach(item => {
            notify(item.textContent.trim(), item.dataset.type);
        });
    }
})();
</script>
<style>@keyframes toastSlideOut { from { opacity: 1; transform: translateX(0) scale(1); } to { opacity: 0; transform: translateX(35px) scale(.97); } }</style>
